name: Nuked-SC55 P256 Autobuild

on:
  push:
    paths:
      - 'templates/**'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuked-sc55-p256-autobuild
  cancel-in-progress: false

jobs:
  build:
    name: Create template archive
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine next release number
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner,
                repo,
                per_page: 100
              }
            );

            let maxRevision = 0;

            for (const release of releases) {
              const match = release.tag_name.match(/^autobuild-r(\d+)$/);

              if (match) {
                maxRevision = Math.max(
                  maxRevision,
                  parseInt(match[1], 10)
                );
              }
            }

            const nextRevision = maxRevision + 1;

            core.setOutput('revision', nextRevision);
            core.setOutput('tag', `autobuild-r${nextRevision}`);
            core.setOutput(
              'zip',
              `nuked_sc55_p256_autobuild_r${nextRevision}.zip`
            );

            console.log(`Latest successful autobuild: r${maxRevision}`);
            console.log(`Next autobuild: r${nextRevision}`);

      - name: Prepare release package
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="$GITHUB_WORKSPACE/package"

          rm -rf "$PACKAGE_DIR"
          rm -f "$ZIP_NAME"

          mkdir -p \
            "$PACKAGE_DIR/roms" \
            "$PACKAGE_DIR/templates"

          # Copy the ROM documentation.
          if [ ! -f "roms/README.md" ]; then
            echo "ERROR: roms/README.md was not found."
            exit 1
          fi

          cp "roms/README.md" "$PACKAGE_DIR/roms/"

          # Copy all .p256tpl files directly from templates/.
          # Files in subdirectories are intentionally excluded.
          shopt -s nullglob
          template_files=(templates/*.p256tpl)

          if [ ${#template_files[@]} -eq 0 ]; then
            echo "ERROR: No .p256tpl files found directly in the templates directory."
            exit 1
          fi

          echo "Template files to package:"
          printf ' - %s\n' "${template_files[@]}"

          cp "${template_files[@]}" "$PACKAGE_DIR/templates/"

          # Copy the required files into the ZIP root.
          for file in LICENSE.md p256_builder.py README.md; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required root file '$file' was not found."
              exit 1
            fi

            cp "$file" "$PACKAGE_DIR/"
          done

          echo
          echo "Package contents:"
          find "$PACKAGE_DIR" -type f -printf '%P\n' | sort

          (
            cd "$PACKAGE_DIR"

            zip -9 -r -X "../$ZIP_NAME" \
              roms \
              templates \
              LICENSE.md \
              p256_builder.py \
              README.md
          )

      - name: Verify ZIP contents
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail

          echo "ZIP contents:"
          unzip -l "$ZIP_NAME"

          echo
          echo "Verifying archive contents..."

          PACKAGE_DIR="$GITHUB_WORKSPACE/package"

          expected_files="$(
            find "$PACKAGE_DIR" \
              -type f \
              -printf '%P\n' \
              | sort
          )"

          actual_files="$(
            unzip -Z1 "$ZIP_NAME" \
              | sort
          )"

          if [ "$expected_files" != "$actual_files" ]; then
            echo "ERROR: ZIP contents do not match the release package."
            echo
            echo "Expected:"
            printf '%s\n' "$expected_files"
            echo
            echo "Actual:"
            printf '%s\n' "$actual_files"
            exit 1
          fi

          # Make sure no unexpected files or directories are present.
          unexpected_files="$(
            unzip -Z1 "$ZIP_NAME" \
              | grep -Ev \
                '^(roms/README\.md|templates/[^/]+\.p256tpl|LICENSE\.md|p256_builder\.py|README\.md)$' \
              || true
          )"

          if [ -n "$unexpected_files" ]; then
            echo "ERROR: Unexpected files found in ZIP:"
            printf '%s\n' "$unexpected_files"
            exit 1
          fi

          # Make sure there are no template subdirectories.
          template_subdirs="$(
            unzip -Z1 "$ZIP_NAME" \
              | grep '^templates/.*/' \
              || true
          )

          if [ -n "$template_subdirs" ]; then
            echo "ERROR: Template subdirectories found in ZIP:"
            printf '%s\n' "$template_subdirs"
            exit 1
          fi

          echo "ZIP contents verified successfully."

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Autobuild r${{ steps.version.outputs.revision }}
          prerelease: true
          artifacts: ${{ steps.version.outputs.zip }}
          artifactErrorsFailBuild: true
          body: |
            This automated release contains latest template files for the generation of **Nuked-SC55/88** CLAP/VST2 files.

            **INSTRUCTIONS**

            - Extract the attached zipfile to your hard drive
            - Copy your SC-55/88 ROM files into the "roms" subdirectory
            - Execute the Python script (p256_builder.py): **python p256_builder.py**
            - Converted files will end up in two new folders, named "output/CLAP" and "output/VST2"