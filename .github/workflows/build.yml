name: Nuked-SC55 P256 Autobuild

# Releases contain the patcher (patcher.py frozen with PyInstaller, templates inside) for Windows,
# Linux and macOS (Apple Silicon and Intel). The patcher runs the functions of p256_builder.py,
# so it always produces the same plugins as the Python script, which stays in the repository
# for development.

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'icons/**'
      - 'p256_builder.py'
      - 'patcher.py'
      - 'patcher_i18n.py'
      - 'selfupdate.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuked-sc55-p256-autobuild
  cancel-in-progress: false

jobs:
  version:
    name: Determine release number
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.version.outputs.revision }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Python syntax and templates
        run: |
          set -euo pipefail
          python3 -m py_compile p256_builder.py patcher.py patcher_i18n.py selfupdate.py
          python3 patcher.py --selftest

      - name: Next release number
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            let max = 0;
            for (const r of releases) {
              const m = r.tag_name.match(/^autobuild-r(\d+)$/);
              if (m) max = Math.max(max, parseInt(m[1], 10));
            }
            core.setOutput('revision', max + 1);
            core.setOutput('tag', `autobuild-r${max + 1}`);
            console.log(`Next autobuild: r${max + 1}`);

  build:
    name: Patcher ${{ matrix.label }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, label: Windows,            asset: windows }
          - { os: ubuntu-22.04,   label: Linux,              asset: linux }
          - { os: macos-15,       label: macOS Apple Silicon, asset: macos-applesilicon }
          - { os: macos-15-intel, label: macOS Intel,        asset: macos-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller python-bidi arabic-reshaper   # bidi/reshaper: right-to-left texts on Linux

      - name: Build patcher
        env:
          REVISION: r${{ needs.version.outputs.revision }}
        run: |
          set -euo pipefail
          echo "VERSION = '$REVISION'" > patcher_version.py
          ICON=()   # file icon of the executable / app: Windows .ico, macOS .icns (Linux has none; the window icon is set in patcher.py)
          case "${{ runner.os }}" in
            Windows) ICON=(--icon icons/patcher.ico) ;;
            macOS)   ICON=(--icon icons/patcher.icns) ;;
          esac
          python -m PyInstaller --onefile --windowed --noconfirm --clean \
            --name Nuked-SC55-P256-Patcher \
            --add-data "templates:templates" \
            --add-data "icons:icons" \
            ${ICON[@]+"${ICON[@]}"} \
            --hidden-import p256_builder --hidden-import patcher_i18n --hidden-import patcher_version \
            --hidden-import selfupdate \
            patcher.py
          ls -la dist

      - name: Self test and package
        env:
          NAME: Nuked-SC55-P256-Patcher-r${{ needs.version.outputs.revision }}-${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p upload
          case "${{ runner.os }}" in
            Windows)
              ./dist/Nuked-SC55-P256-Patcher.exe --selftest
              cp dist/Nuked-SC55-P256-Patcher.exe "upload/$NAME.exe" ;;
            Linux)
              ./dist/Nuked-SC55-P256-Patcher --selftest
              tar -C dist -czf "upload/$NAME.tar.gz" Nuked-SC55-P256-Patcher ;;
            macOS)
              ./dist/Nuked-SC55-P256-Patcher.app/Contents/MacOS/Nuked-SC55-P256-Patcher --selftest
              ditto -c -k --keepParent dist/Nuked-SC55-P256-Patcher.app "upload/$NAME.zip" ;;
          esac
          ls -la upload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: patcher-${{ matrix.asset }}
          path: upload/*
          if-no-files-found: error

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      # Checkout first: it cleans the workspace and would delete the downloaded assets.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: docs/changelog.md
          sparse-checkout-cone-mode: false

      - name: Download patchers
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: ls -la assets

      - name: Release title from the version history
        id: title
        env:
          REVISION: ${{ needs.version.outputs.revision }}
        run: |
          set -euo pipefail
          name="Autobuild r${REVISION}"
          # The top entry of docs/changelog.md is "## r<N>: <title> (<date>)"; it names this release if N matches.
          top=$(grep -m1 '^## r[0-9]' docs/changelog.md || true)
          if [[ "$top" =~ ^##\ r${REVISION}:\ (.*)$ ]]; then
            title="${BASH_REMATCH[1]}"
            title="${title% (*)}"
            name="${name}: ${title}"
          else
            echo "::warning::docs/changelog.md has no top entry for r${REVISION}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.tag }}
          name: ${{ steps.title.outputs.name }}
          prerelease: false
          makeLatest: true
          artifacts: assets/*
          artifactErrorsFailBuild: true
          body: |
            The **Nuked SC-55 P256 Patcher** creates the **Emu-MT32**, **Nuked-SC55** and **Emu-SC88/SC8820/SC8850** CLAP/VST2 plugins (Windows x64) from your own ROM files. The templates are built in; no Python needed.

            **SUPPORTED ROMS**
            - MT-32 (old 1.x, new 2.x) and CM-32L (one plugin, device chosen in the SETUP menu or by clicking the name; built when at least one of the three sets is complete)
            - SC-55 v1.21
            - SC-55mk2 v1.01 (CTF is applied automatically)
            - SC-88
            - SC-88 Pro
            - SC-8820 (two interfaces: SC-8820, SC-D70)
            - SC-8850

            **DOWNLOAD**
            - Windows: `...-windows.exe`
            - Linux: `...-linux.tar.gz` (extract, then run `Nuked-SC55-P256-Patcher`)
            - macOS: `...-macos-applesilicon.zip` (M1 and newer) or `...-macos-intel.zip` (extract, then open the app)

            **INSTRUCTIONS**
            - Put the patcher in a folder together with your ROM files (subfolders are fine, file names do not matter). It can also be pointed to another folder.
            - Start it, check the list of found models, click **Patch**.
            - The plugins end up in `Plugins/CLAP` and `Plugins/VST2` next to the patcher.
            - The files are not signed: Windows SmartScreen and macOS Gatekeeper warn on the first start. See docs/patcher.md ("The patcher") for how to start it anyway.
            - The generated plugins contain your ROMs. Do not share them.
            - What changed in each version: [docs/changelog.md](https://github.com/${{ github.repository }}/blob/main/docs/changelog.md) (the patcher links to it: **What's new?**).
            - Once you have a release patcher running, it checks for newer Autobuilds itself and offers to update with one click (**Update**, left of **Show details**). See docs/patcher.md ("The patcher") for details and how to turn the check off.

      - name: Remove the Pre-release label from older Autobuild releases (left over from earlier workflow versions)
        uses: actions/github-script@v8
        env:
          CURRENT_REVISION: ${{ needs.version.outputs.revision }}
        with:
          script: |
            // Older Autobuilds stay for regression tests without any label; only the newest one is "Latest".
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRevision = parseInt(process.env.CURRENT_REVISION, 10);
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const release of releases) {
              const match = release.tag_name.match(/^autobuild-r(\d+)$/);
              if (!match || parseInt(match[1], 10) >= currentRevision || !release.prerelease) continue;
              console.log(`Removing the Pre-release label from ${release.tag_name}.`);
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, prerelease: false, make_latest: 'false' });
            }
