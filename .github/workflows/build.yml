name: Nuked-SC55 P256 Autobuild

on:
  push:
    paths:
      - 'templates/**'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuked-sc55-p256-autobuild
  cancel-in-progress: false

jobs:
  build:
    name: Create template archive
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine next release number
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner,
                repo,
                per_page: 100
              }
            );

            let maxRevision = 0;

            for (const release of releases) {
              const match = release.tag_name.match(/^autobuild-r(\d+)$/);

              if (match) {
                maxRevision = Math.max(
                  maxRevision,
                  parseInt(match[1], 10)
                );
              }
            }

            const nextRevision = maxRevision + 1;

            core.setOutput('revision', nextRevision);
            core.setOutput('tag', `autobuild-r${nextRevision}`);
            core.setOutput(
              'zip',
              `nuked_sc55_p256_autobuild_r${nextRevision}.zip`
            );

            console.log(`Latest successful autobuild: r${maxRevision}`);
            console.log(`Next autobuild: r${nextRevision}`);

      - name: Prepare release package
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="$GITHUB_WORKSPACE/package"

          rm -rf "$PACKAGE_DIR"
          rm -f "$ZIP_NAME"

          mkdir -p \
            "$PACKAGE_DIR/roms" \
            "$PACKAGE_DIR/templates"

          echo "Preparing release package..."

          # ROM placeholder
          if [ ! -f "roms/place_roms_here.txt" ]; then
            echo "ERROR: roms/place_roms_here.txt was not found."
            exit 1
          fi

          cp \
            "roms/place_roms_here.txt" \
            "$PACKAGE_DIR/roms/"

          # Template files
          shopt -s nullglob
          template_files=(templates/*.p256tpl)

          if [ ${#template_files[@]} -eq 0 ]; then
            echo "ERROR: No .p256tpl files found directly in the templates directory."
            exit 1
          fi

          echo
          echo "Template files to package:"
          printf ' - %s\n' "${template_files[@]}"

          cp \
            "${template_files[@]}" \
            "$PACKAGE_DIR/templates/"

          # Required files in the ZIP root
          for file in \
            LICENSE.md \
            p256_builder.py \
            README.md
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file '$file' was not found."
              exit 1
            fi

            cp "$file" "$PACKAGE_DIR/"
          done

          echo
          echo "Package contents:"
          find "$PACKAGE_DIR" \
            -type f \
            -printf '%P\n' \
            | sort

          echo
          echo "Creating ZIP archive..."

          (
            cd "$PACKAGE_DIR"

            zip -9 -r -X "../$ZIP_NAME" \
              roms \
              templates \
              LICENSE.md \
              p256_builder.py \
              README.md
          )

          echo
          echo "ZIP archive created:"
          ls -lh "$ZIP_NAME"

      - name: Verify ZIP contents
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail

          echo "ZIP contents:"
          unzip -l "$ZIP_NAME"

          echo
          echo "Verifying archive contents..."

          PACKAGE_DIR="$GITHUB_WORKSPACE/package"

          expected_files="$(
            find "$PACKAGE_DIR" \
              -type f \
              -printf '%P\n' \
              | sort
          )"

          # unzip -Z1 also reports directory entries such as
          # "roms/" and "templates/". Ignore those because
          # expected_files contains files only.
          actual_files="$(
            unzip -Z1 "$ZIP_NAME" \
              | awk '!/\/$/ { print }' \
              | sort
          )"

          if [ "$expected_files" != "$actual_files" ]; then
            echo "ERROR: ZIP contents do not match the release package."
            echo
            echo "Expected files:"
            printf '%s\n' "$expected_files"
            echo
            echo "Actual files:"
            printf '%s\n' "$actual_files"
            exit 1
          fi

          # Make sure that only the intended file types and paths
          # are present in the archive.
          unexpected_files="$(
            printf '%s\n' "$actual_files" \
              | grep -Ev \
                '^(roms/place_roms_here\.txt|templates/[^/]+\.p256tpl|LICENSE\.md|p256_builder\.py|README\.md)$' \
              || true
          )"

          if [ -n "$unexpected_files" ]; then
            echo "ERROR: Unexpected files found in ZIP:"
            printf '%s\n' "$unexpected_files"
            exit 1
          fi

          # Make sure templates are not stored in subdirectories.
          template_subdirs="$(
            printf '%s\n' "$actual_files" \
              | grep '^templates/.*/' \
              || true
          )"

          if [ -n "$template_subdirs" ]; then
            echo "ERROR: Template files found in subdirectories:"
            printf '%s\n' "$template_subdirs"
            exit 1
          fi

          echo
          echo "ZIP contents verified successfully."

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Autobuild r${{ steps.version.outputs.revision }}
          prerelease: true
          artifacts: ${{ steps.version.outputs.zip }}
          artifactErrorsFailBuild: true
          body: |
            This automated release contains latest template files for the generation of **Nuked-SC55/88** CLAP/VST2 files.

            **INSTRUCTIONS**
            - Place these files in a subdir called "templates"
            - Another directory called "roms" (next to "templates") must contain your SC-55/88 ROM files
            - Execute the Python script (p256_builder.py, in the same dir as "templates" and "roms"): **python p256_builder.py**
            - Converted files will end up in two new folders named "output/CLAP" and "output/VST2"

      - name: Delete previous Autobuild releases and tags
        uses: actions/github-script@v8
        env:
          CURRENT_REVISION: ${{ steps.version.outputs.revision }}
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const currentRevision = parseInt(
              process.env.CURRENT_REVISION,
              10
            );

            const currentTag = process.env.CURRENT_TAG;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner,
                repo,
                per_page: 100
              }
            );

            for (const release of releases) {
              const match = release.tag_name.match(/^autobuild-r(\d+)$/);

              if (!match) {
                continue;
              }

              const revision = parseInt(match[1], 10);

              // Never delete the release/tag that was just created.
              if (release.tag_name === currentTag) {
                console.log(
                  `Keeping current Autobuild release ${release.tag_name}.`
                );
                continue;
              }

              // Only remove older Autobuild releases.
              if (revision >= currentRevision) {
                console.log(
                  `Keeping Autobuild release ${release.tag_name} ` +
                  `because it is not older than the current revision.`
                );
                continue;
              }

              console.log(
                `Deleting old Autobuild release ${release.tag_name} ` +
                `(release ID ${release.id}).`
              );

              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id
              });

              console.log(
                `Deleted release ${release.tag_name}.`
              );

              // Delete the corresponding Git tag as well.
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${release.tag_name}`
                });

                console.log(
                  `Deleted Git tag ${release.tag_name}.`
                );
              } catch (error) {
                if (error.status === 404) {
                  console.log(
                    `Git tag ${release.tag_name} was already absent.`
                  );
                } else {
                  throw error;
                }
              }
            }

            console.log(
              `Cleanup complete. Current Autobuild tag ${currentTag} is preserved.`
            );