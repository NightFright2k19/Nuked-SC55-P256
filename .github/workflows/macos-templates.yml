name: macOS templates

# Builds the ROM-free macOS CLAP templates (issue #112) on the macOS runners, one job per architecture
# (tools/build_templates_macos.sh), checks that each template loads after it was filled (without ROMs) and
# signed ad hoc like the patcher does, and uploads them as the artifact "templates-macos-<arch>".
# The templates are then committed to templates/macos-arm64 and templates/macos-x64 by hand; the Autobuild
# (build.yml) only bundles what is in the repository. There are no ROMs in this workflow.

on:
  workflow_dispatch:
  push:
    branches: ['feat/issue-112-macos*']
    paths:
      - 'src/**'
      - 'tools/winbuild/*.sh'
      - 'tools/build_templates_macos.sh'
      - 'tools/test/clapcheck.cpp'
      - '.github/workflows/macos-templates.yml'

permissions:
  contents: read

jobs:
  templates:
    name: Templates ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          brew install cairo
          python -m pip install --upgrade pip pillow cairosvg

      - name: Cache Gearmulator build
        uses: actions/cache@v4
        with:
          path: build-macos/gearmulator
          key: gm-${{ matrix.os }}-${{ hashFiles('src/tools/build_88emu.sh', 'src/third_party/88emu/*.patch') }}

      - name: Build templates
        run: |
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib"   # cairosvg finds libcairo
          bash tools/build_templates_macos.sh

      - name: Check that the templates load
        run: |
          set -euo pipefail
          clang++ -O2 -std=c++17 -I src/include tools/test/clapcheck.cpp -o clapcheck
          mkdir -p check
          for t in templates/macos-${{ matrix.arch }}/*.p256tpl; do
            n=$(basename "$t" .p256tpl)
            python - "$t" "check/$n" << 'PY'
          import sys
          sys.path.insert(0, ".")
          import p256_builder
          data = open(sys.argv[1], "rb").read()
          open(sys.argv[2], "wb").write(p256_builder.fill_template(data, [], "check"))
          PY
            codesign --force --sign - "check/$n"
            file "check/$n"
            ./clapcheck "check/$n" --load
          done

      - name: Upload templates
        uses: actions/upload-artifact@v4
        with:
          name: templates-macos-${{ matrix.arch }}
          path: templates/macos-${{ matrix.arch }}/*.p256tpl
          if-no-files-found: error
