name: macOS templates

# Builds the ROM-free macOS CLAP templates (issue #112) on the macOS runners, one job per architecture
# (tools/build_templates_macos.sh), checks that each template loads after it was filled (with random data, no
# ROMs) and its signature renewed like the patcher does (codesign --verify), takes screenshots of each editor
# (tools/test/clapgui_mac.mm) and uploads both as artifacts. The commit job then commits the templates to
# templates/macos-arm64 and templates/macos-x64 of the branch and publishes the screenshots to the branch
# preview/<branch>; the Autobuild (build.yml) only bundles what is in the repository. There are no ROMs in this workflow.

on:
  workflow_dispatch:
  push:
    branches: ['feat/issue-112-macos*']
    paths:
      - 'src/**'
      - 'tools/winbuild/*.sh'
      - 'tools/build_templates_macos.sh'
      - 'tools/test/clapcheck.cpp'
      - 'tools/test/clapgui_mac.mm'
      - '.github/workflows/macos-templates.yml'

permissions:
  contents: read

concurrency:
  group: macos-templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  templates:
    name: Templates ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          brew install cairo
          python -m pip install --upgrade pip pillow cairosvg

      - name: Cache Gearmulator build
        uses: actions/cache@v4
        with:
          path: build-macos/gearmulator
          key: gm-${{ matrix.os }}-${{ hashFiles('src/tools/build_88emu.sh', 'src/third_party/88emu/*.patch') }}

      - name: Build templates
        run: |
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib"   # cairosvg finds libcairo
          bash tools/build_templates_macos.sh

      - name: Check that the templates load
        run: |
          set -euo pipefail
          clang++ -O2 -std=c++17 -I src/include tools/test/clapcheck.cpp -o clapcheck
          mkdir -p check
          for t in templates/macos-${{ matrix.arch }}/*.p256tpl; do
            n=$(basename "$t" .p256tpl)
            # filled with 1 MB of random data instead of ROMs (the check only loads and creates the plug-ins), once
            # with the signature renewed by p256_builder.macho_resign (what the patcher does) and once without
            python - "$t" "check/$n" << 'PY'
          import os, sys
          sys.path.insert(0, ".")
          import p256_builder as b
          data = b.fill_template(open(sys.argv[1], "rb").read(), [(0, os.urandom(1 << 20))], "check")
          print(sys.argv[2], b.verify_plugin(data))
          open(sys.argv[2], "wb").write(b.macho_resign(data))
          open(sys.argv[2] + "-unsigned", "wb").write(data)
          PY
            file "check/$n"
            if [ "${{ matrix.arch }}" = arm64 ]; then
              # the renewed signature must be valid, the old one invalid (pages are checked when they are read, so a
              # load alone would not notice the stale ROM pages)
              codesign --verify --verbose "check/$n"
              if codesign --verify "check/$n-unsigned" 2> /dev/null; then
                echo "unexpected: the old signature is still valid, so the check proves nothing" >&2; exit 1
              fi
            fi
            ./clapcheck "check/$n" --load
          done

      - name: Editor screenshots
        run: |
          set -uo pipefail
          clang++ -O2 -std=c++17 -fobjc-arc -I src/include tools/test/clapgui_mac.mm -framework Cocoa -o clapgui_mac
          mkdir -p previews/${{ matrix.arch }}
          # SETUP button of each panel (editor coordinates); clapgui_mac stops itself after 20 s (no timeout on macOS)
          for m in "Nuked-SC55_v121 848 255" "Nuked-SC55_MkII 848 255" "Emu-SC88 328 255" "Emu-SC88_Pro 328 255" \
                   "Emu-SC8820 856 252" "Emu-SC8850 848 255" "Emu-MT32 856 241"; do
            set -- $m
            ./clapgui_mac "build-macos/tpl/out_tpl/$1.dylib" "previews/${{ matrix.arch }}/$1" $2 $3 || echo "$1: exit $?"
          done
          ls -la previews/${{ matrix.arch }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: previews-macos-${{ matrix.arch }}
          path: previews/${{ matrix.arch }}/*.png
          if-no-files-found: warn

      - name: Upload templates
        uses: actions/upload-artifact@v4
        with:
          name: templates-macos-${{ matrix.arch }}
          path: templates/macos-${{ matrix.arch }}/*.p256tpl
          if-no-files-found: error

  commit:
    name: Commit templates
    needs: templates
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download templates and screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: '*-macos-*'

      - name: Commit changed templates
        run: |
          set -euo pipefail
          for a in arm64 x64; do
            rm -rf templates/macos-$a && mkdir -p templates/macos-$a
            cp templates-macos-$a/*.p256tpl templates/macos-$a/
          done
          git add templates/macos-arm64 templates/macos-x64
          if git diff --cached --quiet; then echo "templates unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "macOS templates from the macOS runners (run ${{ github.run_id }})"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish screenshots
        # to the branch preview/<branch> (replaced each time), for looking at them without downloading artifacts
        run: |
          set -euo pipefail
          ls -d previews-macos-* > /dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          mkdir ../pv && cd ../pv && git init -q && git checkout -q -b preview
          for d in "$GITHUB_WORKSPACE"/previews-macos-*; do mkdir -p "$(basename "$d")" && cp "$d"/*.png "$(basename "$d")/" || true; done
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Editor screenshots from the macOS runners (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/preview/${{ github.ref_name }}
